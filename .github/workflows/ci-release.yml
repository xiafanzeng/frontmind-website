name: Website CI and release

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22.22.2"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  promotion-gate:
    name: Verify exact production source before build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: verify
        name: Verify PR, merge tree and exact successful PR workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/verify-promotion-main-push.sh
          echo "source_sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"

  verify:
    name: Verify (${{ matrix.command }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - check
          - test:server
          - test:client
          - test:release:repository
          - test:registry-retention
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.command }}

  promotion-merge-proof:
    name: Bind successful PR run to its exact test merge
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create canonical PR merge proof
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/write-promotion-merge-proof.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-name "Website CI and release" \
            --workflow-path ".github/workflows/ci-release.yml" \
            --output "$RUNNER_TEMP/promotion-merge-proof.json"
      - name: Upload exact PR merge proof
        uses: actions/upload-artifact@v4
        with:
          name: frontmind-production-merge-proof-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-merge-proof.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  build:
    name: Build, push and sign image
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.promotion-gate.result == 'success'
    needs: [verify, promotion-gate]
    env:
      FRONTMIND_RELEASE_SOURCE_SHA: ${{ needs.promotion-gate.outputs.source_sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      source_sha: ${{ needs.promotion-gate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.promotion-gate.outputs.source_sha }}
      - name: Verify immutable source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FRONTMIND_RELEASE_SOURCE_SHA"
          test "$GITHUB_SHA" = "$FRONTMIND_RELEASE_SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ needs.promotion-gate.outputs.source_sha }}
          build-args: |
            FRONTMIND_BUILD_SHA=${{ needs.promotion-gate.outputs.source_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign exact image digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

  deploy:
    name: Deploy signed website digest
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.promotion-gate.result == 'success'
    needs: [verify, promotion-gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.promotion-gate.outputs.source_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure restricted deploy key
        env:
          DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_KEY:?WEBSITE_DEPLOY_SSH_PRIVATE_KEY is required}"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/website_deploy"
          chmod 0600 "$HOME/.ssh/website_deploy"
          install -m 0644 .github/deploy/production_known_hosts "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/website_deploy" >/dev/null
      - name: Invoke the server forced-command controller
        env:
          DEPLOY_HOST: 149.88.85.148
          DEPLOY_PORT: "22"
          DEPLOY_USER: frontmind-deploy
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n%s\n' "$GHCR_USERNAME" "$GHCR_TOKEN" |
            ssh -T \
              -i "$HOME/.ssh/website_deploy" \
              -p "$DEPLOY_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "${IMAGE_NAME}@${IMAGE_DIGEST} ${{ needs.promotion-gate.outputs.source_sha }}"
      - name: Record immutable successful-deployment marker
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          export IMAGE="${IMAGE_NAME,,}"
          node scripts/mark-ghcr-promoted.mjs --marker-prefix deployed
