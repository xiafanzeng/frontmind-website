name: Website CI and release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_mode:
        description: Build and sign the exact Website production artifact
        required: true
        default: build-only
        type: choice
        options:
          - build-only

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22.22.2"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify (${{ matrix.command }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - check
          - test:server
          - test:client
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.command }}

  build:
    name: Build, push and sign image
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.verify.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.release_mode == 'build-only')) &&
      github.ref == 'refs/heads/main'
    needs: verify
    env:
      FRONTMIND_RELEASE_SOURCE_SHA: ${{ github.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      source_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify immutable source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FRONTMIND_RELEASE_SOURCE_SHA"
          test "$GITHUB_SHA" = "$FRONTMIND_RELEASE_SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Verify source is still current production main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" |
              jq -er 'select(.ref == "refs/heads/main" and .object.type == "commit") | .object.sha | select(test("^[a-f0-9]{40}$"))'
          )"
          test "$current_main_sha" = "$FRONTMIND_RELEASE_SOURCE_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            FRONTMIND_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign exact image digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"
      - name: Record exact reusable production digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          printf '### Website production artifact\n\n- Source: `%s`\n- Digest: `%s`\n' \
            "$GITHUB_SHA" "$IMAGE_DIGEST" >>"$GITHUB_STEP_SUMMARY"
