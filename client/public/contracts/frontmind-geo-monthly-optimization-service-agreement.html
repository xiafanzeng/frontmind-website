<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>FrontMind 合同确认说明</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: #25202c;
        background: #f6f3f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(28px, 6vw, 54px);
        border: 1px solid #ded5e5;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 24px 70px rgb(57 35 72 / 10%);
      }

      img {
        width: 152px;
        height: auto;
      }

      h1 {
        margin: 32px 0 16px;
        font-size: clamp(26px, 5vw, 38px);
        line-height: 1.2;
      }

      p {
        margin: 0 0 14px;
        color: #655b6c;
        font-size: 16px;
        line-height: 1.8;
      }

      .notice {
        margin: 26px 0;
        padding: 18px 20px;
        border-left: 4px solid #6f2ca2;
        border-radius: 8px;
        background: #f7effc;
        color: #3d274b;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 10px;
        color: #fff;
        background: #5e2588;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #b985dd;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/frontmind-logo.svg" alt="FrontMind" />
      <h1>合同在企业微信完成确认</h1>
      <p>
        FrontMind
        网站不提供合同在线查看、下载或签署。正式合同由管理员在企业微信发送，双方核对合同版本并完成有效电子签名或盖章文件确认。
      </p>
      <p class="notice">
        本页面仅用于流程说明，不能作为合同文件、签署页面或付款凭证。
      </p>
      <p>
        请返回服务开通页，提交企业资料并扫码联系管理员。管理员完成合同确认后会提供合同码，用于进入付款步骤。
      </p>
      <a href="/#geo-builder">返回服务开通页</a>
    </main>
  </body>
</html>
